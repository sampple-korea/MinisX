org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The Kotlin compiler runs in its own daemon; at the inherited 2 GB the release (R8-sized) compile
# thrashes in GC and dies with OutOfMemoryError on 7 GB CI runners.
kotlin.daemon.jvmargs=-Xmx3584m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
