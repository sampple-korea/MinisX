name: Android

# Builds the signed APK when started by hand or when a tag like v0.2 is pushed, and publishes it as a
# GitHub release. Every build is signed with the same release key, which lives in the repository's
# Actions secrets (MINISX_KEYSTORE_B64, MINISX_KEYSTORE_PASSWORD), and the job fails if the APK is
# ever signed with anything else.
# Build only: there is deliberately no test/verification job (it cost CI minutes).

# No push-to-main trigger on purpose: builds are started by hand (here, or from the public
# minisx-ci repository, see docs/ci-shuttle/README.md) so private-repo runner minutes are not spent
# on every commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1); created on the built commit. Leave empty for a plain build."
        required: false
        default: ""
      version_code:
        description: "Force this versionCode (e.g. 1 for the first release). Leave empty to use run number - 5."
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the APK to a release

env:
  # SHA-256 of the release signing certificate (public information).
  # If an APK is ever signed with anything else, the build stops here instead of
  # producing an APK that cannot be installed over the previous one.
  EXPECTED_CERT_SHA256: cb9520bc64851a2ae3e92e61ac99a5449f12cb5e468c78622ee2593c43c7d2dc
  BUILD_TOOLS: 36.0.0
  NDK_VERSION: 28.0.12433566
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # deps/proot

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already has the Android SDK (ANDROID_HOME); just put its sdkmanager on PATH.
      # (android-actions/setup-android fails on current images: it asks for the removed "tools" package.)
      - name: Android SDK tools
        run: |
          echo "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"

      - name: Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: deps/rclone-mobile/go.sum

      # proot's build runs loader-info.awk, which needs gawk's strtonum (the default mawk lacks it).
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y gawk

      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Native dependencies (proot, Alpine rootfs, rclone)
        run: |
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          FORCE_CODE: ${{ inputs.version_code }}
        run: |
          # The app restarted at 0.1 / versionCode 1 when it became com.minisx.app; run #5 was the
          # last build of the old line, so run number - 5 keeps counting up from 1.
          code="${FORCE_CODE:-$((GITHUB_RUN_NUMBER - 5))}"
          if (( code < 1 )); then code=1; fi
          tag="${RELEASE_TAG:-}"
          if [[ -z "$tag" && "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -n "$tag" ]]; then name="${tag#v}"; else name="0.1-build.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code versionName=$name"

      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.MINISX_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret MINISX_KEYSTORE_B64 is not set (see BUILDING.md, Signing)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/minisx-release.jks"
          echo "MINISX_KEYSTORE=$RUNNER_TEMP/minisx-release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: src/android
        env:
          MINISX_KEYSTORE_PASSWORD: ${{ secrets.MINISX_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleGithubRelease \
            -Pminis.versionCode=${{ steps.version.outputs.code }} \
            -Pminis.versionName=${{ steps.version.outputs.name }}

      - name: Check the signature
        run: |
          apk=$(ls src/android/app/build/outputs/apk/github/release/*.apk | head -1)
          out="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          "$out" verify --print-certs "$apk" | tee /tmp/certs.txt
          actual=$(grep -m1 'certificate SHA-256 digest' /tmp/certs.txt | awk '{print $NF}')
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with $actual, expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
          cp "$apk" "minis-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: minis-apk
          path: minis-${{ steps.version.outputs.name }}.apk
          retention-days: 90

      - name: Native debug symbols
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-debug-symbols
          path: src/android/app/build/outputs/native-debug-symbols/**
          if-no-files-found: ignore
          retention-days: 30

      - name: GitHub release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: minis-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
