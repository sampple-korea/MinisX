# Lives in the PUBLIC repository (e.g. sampple-korea/minisx-ci) at .github/workflows/build.yml.
# It checks out the private MinisX repository, builds it on the public repo's faster, free runners
# and publishes the APK as a release of the PRIVATE repository. Nothing is uploaded to this public
# repository, and the build output goes to a file (scripts/ci_build.sh), so the public log only
# shows one line per step. On failure the log tail is committed to the private repository's
# `ci-logs` branch instead.
#
# Only manual runs (workflow_dispatch): nobody else can start it, and no pull_request trigger
# means a fork cannot run a modified copy with the token.
name: MinisX build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of MinisX to build"
        default: main
      version_name:
        description: "versionName and release tag without the v, e.g. 0.2 (a name with '-' becomes a prerelease)"
        required: true
      version_code:
        description: "Integer versionCode, higher than the last release (the first one was 1)"
        required: true

permissions:
  contents: read

concurrency:
  group: minisx-build
  cancel-in-progress: false

env:
  PRIVATE_REPO: sampple-korea/MinisX
  GH_TOKEN: ${{ secrets.MINISX_PAT }}
  CI_LOG: ${{ github.workspace }}/../build.log
  OUT_APK: ${{ github.workspace }}/../minis.apk

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sampple-korea/MinisX
          ref: ${{ inputs.ref }}
          token: ${{ secrets.MINISX_PAT }}
          submodules: recursive
          path: src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never # the summary lists tasks and project names

      - name: Build
        working-directory: src
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: ./scripts/ci_build.sh

      - name: Publish the release to the private repository
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          sha="$(git -C src rev-parse HEAD)"
          flags=(--generate-notes)
          [[ "$VERSION_NAME" == *-* ]] && flags+=(--prerelease)
          cp "$OUT_APK" "minis-${VERSION_NAME}.apk"
          gh release create "v${VERSION_NAME}" "minis-${VERSION_NAME}.apk" \
            -R "$PRIVATE_REPO" --target "$sha" --title "v${VERSION_NAME}" "${flags[@]}" > /dev/null
          echo "Released v${VERSION_NAME}"

      - name: Keep the failure log in the private repository
        if: failure()
        run: |
          log="${CI_LOG}"
          [ -f "$log" ] || exit 0
          tail -n 2500 "$log" > "$RUNNER_TEMP/tail.log"
          base="$(gh api "repos/${PRIVATE_REPO}/git/ref/heads/main" -q .object.sha)"
          gh api "repos/${PRIVATE_REPO}/git/refs" -f ref=refs/heads/ci-logs -f sha="$base" > /dev/null 2>&1 || true
          base64 -w0 "$RUNNER_TEMP/tail.log" \
            | jq -Rs --arg m "build log run ${GITHUB_RUN_NUMBER}" '{message:$m, branch:"ci-logs", content:.}' \
            | gh api -X PUT "repos/${PRIVATE_REPO}/contents/logs/run-${GITHUB_RUN_NUMBER}.log" --input - > /dev/null
          echo "Build failed; log saved to the private repository (branch ci-logs)."
